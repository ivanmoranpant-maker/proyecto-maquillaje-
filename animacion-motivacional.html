<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hoy empiezo</title>
  <style>
    /*
      Línea de tiempo (segundos):
        0.5 – 3.5   "Hoy empiezo."         fade in / fade out
        3.5 – 6.5   "Sin excusas."         fade in / fade out
        6.5 →       "Meta: 10.000 al mes." fade in y se queda
        7.6 – 9.0   línea que se dibuja debajo de la meta
    */
    :root {
      --bg: #000;
      --fg: #fff;
      --phrase: 3s;
      --fade-ease: cubic-bezier(.45, 0, .25, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    /* Lienzo vertical 9:16, lo más grande posible dentro de la pantalla */
    .stage {
      width: min(100vw, 100dvh * 9 / 16);
      aspect-ratio: 9 / 16;
      container-type: inline-size;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: "Helvetica Neue", Helvetica, Inter, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: -0.02em;
      -webkit-font-smoothing: antialiased;
    }

    .phrase {
      grid-area: 1 / 1;
      font-size: 8.4cqw;
      line-height: 1.1;
      white-space: nowrap;
      opacity: 0;
    }

    .p1 { animation: fade-in-out var(--phrase) var(--fade-ease) 0.5s both; }
    .p2 { animation: fade-in-out var(--phrase) var(--fade-ease) 3.5s both; }
    .p3 { animation: fade-in 1s var(--fade-ease) 6.5s both; }

    .goal {
      position: relative;
      display: inline-block;
    }

    /* Línea delgada que se dibuja de izquierda a derecha bajo la meta */
    .goal::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -0.32em;
      height: max(1px, 0.3cqw);
      background: var(--fg);
      transform: scaleX(0);
      transform-origin: left center;
      animation: draw 1.4s cubic-bezier(.65, 0, .35, 1) 7.6s both;
    }

    @keyframes fade-in-out {
      0%   { opacity: 0; }
      25%  { opacity: 1; }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes draw {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <main class="stage" aria-live="polite">
    <p class="phrase p1">Hoy empiezo.</p>
    <p class="phrase p2">Sin excusas.</p>
    <p class="phrase p3"><span class="goal">Meta: 10.000 al mes.</span></p>
  </main>
</body>
</html>
